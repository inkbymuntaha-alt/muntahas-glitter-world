name: Publish Muntaha's Glitter World
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-glitter-world
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Validate game JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, re.I | re.S)
          if not scripts:
              raise SystemExit("No inline game script found")
          Path("/tmp/muntaha-game.js").write_text("\n".join(scripts), encoding="utf-8")
          print(f"Found {len(scripts)} inline script block(s)")
          PY
          node --check /tmp/muntaha-game.js
      - name: Validate design catalogue
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          base = html.split("const designs=[", 1)[1].split("const extraCollections=", 1)[0]
          base_names = re.findall(r"\{name:'([^']+)'", base)
          extra = html.split("const extraCollections=[", 1)[1].split("function makeExtraPaths", 1)[0]
          name_groups = re.findall(r"names:\[([^\]]+)\]", extra)
          extra_names = [name for group in name_groups for name in re.findall(r"'([^']+)'", group)]
          generated = html.split("const generatedDesigns500=(()=>{", 1)[1].split("function poly", 1)[0]
          match = re.search(r"const themes=\[(.*?)\];\s*const suffix=\[(.*?)\];", generated, re.S)
          if not match:
              raise SystemExit("Could not inspect generated design catalogue")
          themes = re.findall(r"\['([^']+)','[^']+'\]", match.group(1))
          suffixes = re.findall(r"'([^']+)'", match.group(2))
          bonus = html.split("const bonusDesigns=[", 1)[1].split("designs.push(", 1)[0]
          bonus_names = re.findall(r"\{name:'([^']+)'", bonus)
          all_names = base_names + extra_names + [theme + " " + suffix for theme in themes for suffix in suffixes] + bonus_names
          colours = html.split("const colours=[", 1)[1].split("let chosen=", 1)[0]
          colour_count = len(re.findall(r"\['[^']+','#", colours))
          if (len(base_names), len(extra_names), len(themes), len(suffixes), len(bonus_names), len(all_names), len(set(all_names)), colour_count) != (20, 100, 38, 10, 12, 512, 512, 47):
              raise SystemExit(f"Catalogue check failed: base={len(base_names)}, extra={len(extra_names)}, themes={len(themes)}, variations={len(suffixes)}, bonus={len(bonus_names)}, total={len(all_names)}, unique={len(set(all_names))}, colours={colour_count}")
          if "b.append(preview,label)" not in html:
              raise SystemExit("Design cards must show their individual artwork thumbnails")
          print("Verified 512 uniquely named designs and 47 colours")
          PY
      - name: Publish website to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .
          exclude_assets: '.github'
          force_orphan: true
